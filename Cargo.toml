[workspace]
resolver = "3"
members = [
  "crates/grid_math",
  "crates/grid_storage",
  "crates/tile_topology",
  "crates/grid_generation",
  "crates/grid_prelude",
  "demos/cli_dual_grid_demo",
]

default-members = [
  "crates/grid_math",
  "crates/grid_storage",
  "crates/tile_topology",
  "crates/grid_prelude",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fastnoise-lite = "1.1.1"
glam = "0.31.0"
grid_generation = { path = "crates/grid_generation" }
grid_math = { path = "crates/grid_math" }
grid_prelude = { path = "crates/grid_prelude" }
grid_storage = { path = "crates/grid_storage" }
tile_topology = { path = "crates/tile_topology" }
rand = "0.9.2"
