name: Grid Neutral Cutover CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "demos/**"
      - "adapters/**"
      - "docs/**"
      - ".github/workflows/grid-neutral-cutover.yml"
  workflow_dispatch:

jobs:
  neutral-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Verify pinned workspace and no Godot package
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /tmp/grid-metadata.json
          ! grep -q '"name":"godot_grid"' /tmp/grid-metadata.json
          ! grep -q '^name = "godot"' Cargo.lock
          ! grep -q '^name = "godot_grid"' Cargo.lock
          ! grep -q 'godot' Cargo.toml
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Neutral core default tests
        run: cargo test --locked
      - name: Explicit procedural generation tests
        run: cargo test --locked -p grid_generation
      - name: Authoritative topology tests
        run: cargo test --locked -p tile_topology
      - name: CLI demo smoke
        run: cargo run --locked -p cli_dual_grid_demo -- --seed 123
